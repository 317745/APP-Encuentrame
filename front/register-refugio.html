<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar refugio · Encuéntrame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="" class="brand__logo">
      <span class="brand__name">Encuéntrame</span>
    </a>

    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false">☰</button>

    <nav class="nav" id="nav">
      <a href="index.html" class="nav__link">Inicio</a>
      <a href="colaboradores.html" class="nav__link">Colaboradores</a>
      <a href="usuarios.html" class="nav__link">Usuarios</a>
      <a href="refugios.html" class="nav__link">Refugios</a>
      <a href="como-funciona.html" class="nav__link">Cómo funciona</a>
    </nav>
  </header>

  <main class="auth">
    <img src="img/mascota-hero.png" alt="" class="auth__mascot">
    <section class="card auth__card">
      <h1 class="card__title">Registrar refugio</h1>
      <p class="auth__sub">Registra tu refugio o fundación para gestionar rescates y publicar animales.</p>

      <form id="registerForm" class="form" data-role="fundation" novalidate>
        <label for="name">Nombre del refugio</label>
        <input type="text" id="name" name="name" autocomplete="name" required maxlength="255">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" autocomplete="email" required maxlength="255" placeholder="tucorreo@ejemplo.com">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required >

        <label class="check">
          <input type="checkbox" id="consent" name="consent">
          <span>Autorizo que el correo de mi fundación se muestre a los usuarios para que puedan contactarme por posibles coincidencias.</span>
        </label>

        <p id="formMsg" class="form-msg" role="alert" aria-live="polite"></p>
        <button type="submit" id="submitBtn" class="btn">Registrar refugio</button>
      </form>

      <p class="auth__alt">¿Ya tienes cuenta? <a href="refugios.html">Inicia sesión</a></p>
    </section>
  </main>
  <script src="session.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
